# Local pilot for complementary geometry. Latent coordinates are evaluation only.
# The structural loss is multiscale neighborhood preservation on the full
# observed matrix. It is fixed here, before any consensus score is computed.

study: complementary
n_samples: 200
noise: 0.05
n_nuisance: 8
primary_epsilon: 0.05
structural_ks: [5, 15, 30]
eval_triplets: 3000
eval_seed_offset: 7000
conditions:
  - name: square
    aspect: [1.0, 1.0]
    hide_second: false
    replications: [0, 1, 2, 3]
    seed_offset: 4000
  - name: long
    aspect: [5.0, 1.0]
    hide_second: false
    replications: [0, 1, 2, 3]
    seed_offset: 4100
  - name: stretched
    aspect: [5.0, 1.0]
    hide_second: false
    preserve_scale: true
    replications: [0, 1, 2, 3]
    seed_offset: 4300
  - name: square_hidden
    aspect: [1.0, 1.0]
    hide_second: true
    replications: [0, 1, 2, 3]
    seed_offset: 4200
