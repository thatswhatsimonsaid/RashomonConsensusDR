# Natural candidate diversity. Frozen before any consensus score from this study.
# Epoch counts are longer than Checkpoint 6 (50 CNE, 200 PaCMAP).
# A one-seed Swiss-roll diagnostic, run before this grid, is why they stay here.
# UMAP reference loss was 0.288 at 50 epochs, 0.281 at 200, and 0.278 at 400,
# against a negative-draw standard deviation of about 0.057. InfoNCE was
# 0.388, 0.377, and 0.374, against a standard deviation of about 0.106.
# PaCMAP's schedule enters its terminal phase at epoch 200, so 450 epochs
# is 250 epochs of the loss the reference measures. These counts are not
# revised after seeing trustworthiness or triplet accuracy.
# Native losses are compared only inside one (method, k, lambda) family.
# Latent coordinates and digit labels are evaluation columns. They are not
# inputs to membership, weights, trimming, or the regime label.

n: 240
digits_n: 400
cne_epochs: 200
pacmap_epochs: 450
train_seeds: [0, 1, 2]
primary_k: 15
primary_lambda: 0.0
# Separate objectives. Described, and not entered into the primary native-loss band.
extra_umap_k: [5, 50]
lambda_slice:
  methods: [umap, infonce]
  lambda: 5.0
  seeds: [0, 1]
datasets:
  - {name: swiss, kind: swiss, seed: 4000, noise: 0.12}
  - {name: s_curve, kind: s_curve, seed: 4100, noise: 0.08}
  - {name: digits, kind: digits, seed: 4200, noise: 0.0}
epsilons: [0.0, 0.05, 0.25, 1.0, .inf]
primary_epsilon: 0.05
trim_fraction: 0.25
size_matched_draws: 3
gibbs_beta: 1.0
n_triplets: 2000
# Regime thresholds. Relative native span uses the Checkpoint 7 membership scale.
span_small: 0.05
trust_gap: 0.08
disagreement_ratio: 1.5
methods:
  - {name: umap, loss_mode: umap, spectrum: null, early_exaggeration: false}
  - {name: infonce, loss_mode: infonce, spectrum: null, early_exaggeration: true}
  - {name: neg_tsne, loss_mode: neg, spectrum: 0.0, early_exaggeration: true}
  - {name: nce, loss_mode: nce, spectrum: null, early_exaggeration: false}
  - {name: pacmap, loss_mode: null, spectrum: null, early_exaggeration: false}
